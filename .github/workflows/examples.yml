name: Examples

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update pip and CA certificates
        run: |
          python -m pip --disable-pip-version-check install --upgrade --no-index --no-deps --no-cache-dir "https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio "certifi>=2026.10.19"

      - name: Build examples
        run: scripts/build_examples.sh
